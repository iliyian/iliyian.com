name: Mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same embedding endpoint the Cloudflare Pages build uses. The API key
      # lives only in Actions secrets; without it the build still succeeds but
      # precompute_recommend.py skips the recommendation JSON.
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://new-api.iliyian.com/v1' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EMBED_MODEL: ${{ vars.OPENAI_EMBED_MODEL || 'qwen/qwen3-embedding-8b' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyyaml

      # Two credentials are in play:
      #   BLOG_SOURCE_TOKEN       read-only on the private blog submodules
      #   GH_PAGES_DEPLOY_KEY     write on iliyian.github.io
      # A credential helper routes github.com requests to the right token.
      - name: Configure git credentials
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          SOURCE_TOKEN: ${{ secrets.BLOG_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_PAGES_TOKEN" || { echo "::error::GH_PAGES_DEPLOY_KEY is empty"; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo "::error::BLOG_SOURCE_TOKEN is empty"; exit 1; }
          umask 077
          printf '%s' "$GH_PAGES_TOKEN" > "$RUNNER_TEMP/gh-pages-token"
          printf '%s' "$SOURCE_TOKEN" > "$RUNNER_TEMP/source-token"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '[ "${1:-}" = "get" ] || exit 0' \
            'url=""; host=""; path=""' \
            'while IFS="=" read -r key value; do' \
            '  case "$key" in' \
            '    url) url="$value" ;;' \
            '    host) host="$value" ;;' \
            '    path) path="$value" ;;' \
            '  esac' \
            'done' \
            'target="$url$host/$path"' \
            'case "$target" in' \
            '  *iliyian/iliyian.github.io*) file=gh-pages-token ;;' \
            '  *) file=source-token ;;' \
            'esac' \
            'printf "username=x-access-token\\npassword=%s\\n" "$(cat "$RUNNER_TEMP/$file")"' \
            > "$RUNNER_TEMP/git-credential-gh-pages"
          chmod 700 "$RUNNER_TEMP/git-credential-gh-pages"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # Without this, git's credential protocol sends only protocol/host and
          # the helper cannot tell iliyian.github.io apart from the blog repos.
          git config --global credential.useHttpPath true
          git config --global credential.helper "$RUNNER_TEMP/git-credential-gh-pages"

      - name: Checkout private submodules
        run: git submodule update --init --recursive

      - name: Build and deploy
        run: python build.py --deploy

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gh-pages-token" "$RUNNER_TEMP/source-token" "$RUNNER_TEMP/git-credential-gh-pages"
